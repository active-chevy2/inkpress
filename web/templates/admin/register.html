{{define "content"}}
<div class="login-page">
    <div class="login-card">
        {{if .Flash}}<div class="admin-flash admin-flash-success">{{.Flash}}</div>{{end}}
        {{if .FlashError}}<div class="admin-flash admin-flash-error">{{.FlashError}}</div>{{end}}
        <h1 class="login-title">{{.Title}}</h1>
        <form method="POST" action="/admin/register" class="login-form">
            <input type="hidden" name="invite_code" value="{{.Content.InviteCode}}">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required autofocus>
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required value="{{.Content.Email}}">
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
                <small>At least 8 characters.</small>
            </div>
            <div class="form-field">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>
            <button type="submit" class="admin-button">Create Account</button>
        </form>
    </div>
</div>
{{end}}
