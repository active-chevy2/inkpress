{{define "content"}}
<div class="login-page">
    <div class="login-card">
        <h1 class="login-title">Sign in to {{.SiteName}}</h1>
        {{if .Content.FirstUser}}
        <p class="login-first-user">No accounts exist yet. <a href="/admin/register">Create the first admin account →</a></p>
        {{end}}
        <form method="POST" action="/admin/login" class="login-form">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="admin-button">Sign In</button>
        </form>
    </div>
</div>
{{end}}
