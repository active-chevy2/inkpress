{{define "content"}}
<div class="upload-zone">
    <h2>Upload a file</h2>
    <p class="upload-help">Images (JPG, PNG, GIF, WebP, SVG) and PDFs. Max 10 MB.</p>
    <form method="POST" action="/admin/uploads/create" enctype="multipart/form-data" class="upload-form">
        <div class="form-field">
            <label for="file">Choose file</label>
            <input type="file" id="file" name="file" required>
        </div>
        <button type="submit" class="admin-button">Upload</button>
    </form>
</div>

<h2>Uploaded Files</h2>
<table class="admin-table">
    <thead>
        <tr><th>File</th><th>URL</th><th>Size</th><th>Uploaded</th></tr>
    </thead>
    <tbody>
        {{range .Content.Uploads}}
        <tr>
            <td>{{.Filename}}</td>
            <td class="mono"><a href="{{.Path}}" target="_blank">{{.Path}}</a></td>
            <td>{{printf "%.1f KB" (divf .Size 1024)}}</td>
            <td>{{.CreatedAt | formatDate}}</td>
        </tr>
        {{else}}
        <tr><td colspan="4" class="empty-row">No uploads yet.</td></tr>
        {{end}}
    </tbody>
</table>
{{end}}
